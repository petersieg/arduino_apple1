# Flat 4 KiB image mapped at $1000-$1FFF. This requires Apple-1 RAM through $1FFF.
MEMORY {
    RAM: start = $1000, size = $1000, type = rw, file = %O, fill = yes, fillval = $00;
}
SEGMENTS {
    CODE:    load = RAM, type = ro, start = $1000;
    WOZLOG:  load = RAM, type = ro, start = $1D00;
    WOZEXP:  load = RAM, type = ro, start = $1E00;
    WOZCORE: load = RAM, type = ro, start = $1F00;
}
